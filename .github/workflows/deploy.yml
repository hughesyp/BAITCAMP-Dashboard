# Builds the dashboard and uploads it to Azure Static Web Apps using a deployment token.
# The Static Web App itself is not linked to this repo (its source is "Other").
#
# Repository secrets needed (GitHub → Settings → Secrets and variables → Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN  deployment token from the Static Web App's Overview page
#   VITE_SUPABASE_URL                live Supabase project URL
#   VITE_SUPABASE_ANON_KEY           live Supabase anon public key
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing AZURE_STATIC_WEB_APPS_API_TOKEN"
          [ -z "$URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
